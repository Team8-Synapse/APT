name: amrita_placement_tracker
description: Amrita Placement Tracker - Student Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.1

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_markdown: ^0.6.18
  lottie: ^3.0.0
  fl_chart: ^0.68.0

  # File handling
  file_picker: ^8.0.3
  open_file: ^3.5.4
  path_provider: ^2.1.2

  # Utils
  url_launcher: ^6.2.4
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
