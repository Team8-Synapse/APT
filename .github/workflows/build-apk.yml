name: Build Flutter APK

on:
  push:
    branches: [ main, master, adhi_ai ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amrita-placement-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
